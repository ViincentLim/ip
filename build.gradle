plugins {
    id 'java'
    id 'application'
    id 'checkstyle'
    id 'com.gradleup.shadow' version '9.5.1'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

checkstyle {
    toolVersion = '14.1.0'
    configFile = file('config/checkstyle/checkstyle.xml')
}

repositories {
    mavenCentral()
}

boolean isAppleSilicon = System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('mac')
        && (System.getProperty('os.arch').toLowerCase(Locale.ROOT).contains('aarch64')
        || System.getProperty('os.arch').toLowerCase(Locale.ROOT).contains('arm64'))

dependencies {
    String javaFxVersion = '17.0.10'
    ['win', 'mac', 'linux'].each { platform ->
        ['base', 'controls', 'fxml', 'graphics'].each { module ->
            String dependency = "org.openjfx:javafx-${module}:${javaFxVersion}:${platform}"
            if (platform == 'mac' && isAppleSilicon) {
                // Supply the standard macOS classifier for compilation while
                // keeping its Intel natives out of ARM runtime artifacts.
                compileOnly(dependency)
            } else {
                implementation(dependency)
            }
        }
    }

    // Keep the ARM native libraries available when developing on Apple Silicon.
    if (isAppleSilicon) {
        ['base', 'controls', 'fxml', 'graphics'].each { module ->
            runtimeOnly("org.openjfx:javafx-${module}:${javaFxVersion}:mac-aarch64")
        }
    }

    String jUnitVersion = '5.14.4'

    testImplementation "org.junit.jupiter:junit-jupiter-api:${jUnitVersion}"

    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${jUnitVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.14.4'
}

test {
    useJUnitPlatform()

    testLogging {
        events 'passed', 'skipped', 'failed'

        showExceptions = true
        exceptionFormat = 'full'
        showCauses = true
        showStackTraces = true
        showStandardStreams = false
    }
}

application {
    mainClass = 'dude.gui.Launcher'
}

jar {
    // A lean JAR file (i.e., without the dependencies packaged inside) is not needed.
    enabled = false
    // Rename its output anyway; Gradle forbids it clashing with the shadowJar output file, even for a disabled task.
    archiveClassifier = 'without-dependencies'
}

shadowJar {
    archiveFileName = 'dude.jar'
}

run {
    standardInput = System.in
    if (isAppleSilicon) {
        // The standard tutorial matrix remains declared above, but JavaFX must
        // not load Intel macOS natives when this task runs on Apple Silicon.
        classpath = sourceSets.main.runtimeClasspath.filter {
            !it.name.endsWith('-mac.jar')
        }
    }
}
